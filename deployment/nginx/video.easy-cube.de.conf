# Example: configure your own hostname, certificate paths and private bridge addresses.
server {
    listen 80;
    listen [::]:80;
    server_name video.example.org;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/apps/vdo-ninja/acme-webroot;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name video.example.org;

    ssl_certificate /etc/letsencrypt/live/video.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/video.example.org/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    auth_request /_vdo_auth;
    auth_request_set $vdo_user $upstream_http_x_authenticated_user;
    auth_request_set $vdo_session $upstream_http_x_authenticated_session;

    location = /ws {
        access_log off;
        proxy_pass http://172.30.201.179:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header Authorization "";
        proxy_set_header X-Authenticated-User $vdo_user;
        proxy_set_header X-Authenticated-Session $vdo_session;
        proxy_set_header Cookie "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location = /api/turn {
        client_max_body_size 1k;
        proxy_pass http://172.30.201.180:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header Authorization "";
        proxy_set_header X-Authenticated-User $vdo_user;
        proxy_set_header Cookie "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 3s;
        proxy_read_timeout 12s;
        proxy_send_timeout 12s;
    }

    location = /home {
        auth_request off;
        proxy_pass http://172.30.201.180:8080;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Authorization "";
    }

    location = /api/navigation {
        proxy_pass http://172.30.201.180:8080;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Authorization "";
    }

    location ^~ /launch/ {
        error_page 401 =200 /_vdo_login_page;
        proxy_pass http://172.30.201.180:8080;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Authorization "";
        add_header Referrer-Policy "no-referrer" always;
    }

    location = /production-access {
        error_page 401 =200 /_vdo_login_page;
        proxy_pass http://172.30.201.180:8080;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Authorization "";
        proxy_set_header X-Authenticated-User $vdo_user;
    }

    location ^~ /api/production-access {
        client_max_body_size 2k;
        proxy_pass http://172.30.201.180:8080;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Authorization "";
        proxy_set_header X-Authenticated-User $vdo_user;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 30s;
    }

    location = /api/me {
        proxy_pass http://172.30.201.180:8080/api/me;
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        proxy_set_header X-Authenticated-User $vdo_user;
    }

    location = /_vdo_auth {
        internal;
        auth_request off;
        proxy_pass http://172.30.201.180:8080/internal/authenticate;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Obs-Token $http_x_obs_token;
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /_vdo_login_page {
        internal;
        auth_request off;
        proxy_pass http://172.30.201.180:8080/internal/login-page;
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
    }

    location = /media/show-logo.png {
        auth_request off;
        proxy_pass http://172.30.201.178:8080;
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
    }

    location = /favicon.ico {
        auth_request off;
        proxy_pass http://172.30.201.178:8080;
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
    }

    location = /manifest.json {
        auth_request off;
        proxy_pass http://172.30.201.178:8080;
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
    }

    location = /login {
        auth_request off;
        client_max_body_size 2k;
        proxy_pass http://172.30.201.180:8080/login;
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        proxy_set_header X-Real-IP $remote_addr;
    }

    location = /logout {
        auth_request off;
        client_max_body_size 1k;
        proxy_pass http://172.30.201.180:8080/logout;
        proxy_set_header Authorization "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Public software source only; runtime secrets are outside the frontend root.
    location ^~ /source/ {
        auth_request off;
        proxy_pass http://172.30.201.178:8080;
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location ^~ /l/ {
        auth_request off;
        proxy_pass http://172.30.201.180:8080;
        proxy_set_header Host $host;
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
    }

    location ^~ /obs/ {
        auth_request off;
        access_log off;
        proxy_pass http://172.30.201.180:8080;
        proxy_set_header Host $host;
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
    }

    location = /access-denied.html {
        internal;
        auth_request off;
        proxy_pass http://172.30.201.178:8080;
        proxy_set_header Authorization "";
    }

    location ~ ^/(?:index(?:\.html)?)?$ {
        if ($args = "") { return 302 /home; }
        access_log off;
        error_page 401 =200 /_vdo_login_page;
        error_page 403 /access-denied.html;
        add_header Cache-Control "no-store" always;
        add_header Referrer-Policy "no-referrer" always;
        proxy_pass http://172.30.201.178:8080;
        proxy_set_header Authorization "";
        proxy_set_header X-Authenticated-User "";
    }

    location / {
        error_page 401 =200 /_vdo_login_page;
        proxy_pass http://172.30.201.178:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        proxy_set_header X-Authenticated-User "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
