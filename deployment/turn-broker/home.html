<!doctype html>
<html lang="de">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Übersicht · Was weiß ich?!</title><link rel="icon" href="/favicon.ico">
<style>
:root{font:16px/1.5 system-ui;color-scheme:dark;background:#0c1739;color:#f6f9ff}body{margin:0;padding:28px}main{max-width:1100px;margin:auto}header{display:flex;align-items:center;gap:24px;flex-wrap:wrap;margin-bottom:24px}header img{width:180px}h1{font-size:30px;margin:0 0 8px}.account{margin-left:auto}.muted{color:#bfd1ed}a{color:#95ebff}button{cursor:pointer;border:1px solid #78cce9;border-radius:9px;background:#233b69;color:white;padding:9px 16px;font:inherit}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:20px;margin:24px 0}.card{border:1px solid #457da7;border-radius:16px;background:#14234b;padding:24px}h2{margin:0 0 18px}.entry{display:block;border:1px solid #6086b4;border-radius:10px;padding:14px 16px;text-decoration:none;margin:12px 0;background:linear-gradient(115deg,#203d70,#352a69);color:white}.entry strong{display:block;font-size:18px}.entry small{display:block;margin-top:5px;color:#d3e4ff}a:focus-visible,button:focus-visible{outline:3px solid #94ebff;outline-offset:3px}.status{white-space:pre-line}footer{font-size:14px;margin-top:28px}#message:empty{display:none}
</style>
<main>
<header><img src="/media/show-logo.png" alt="Was weiß ich?!"><div><h1 id="title">Übersicht</h1><div class="muted" id="intro">Deine Zugänge werden geladen …</div></div><div class="account"><span>Angemeldet als <strong id="username"></strong></span><p><button id="logout">Abmelden</button></p></div></header>
<div id="message" class="status" role="status" aria-live="polite"></div><div class="grid" id="sections"></div>
<footer><a href="/source/">Quellcode &amp; Lizenz</a></footer>
</main>
<script>
'use strict';
const message = document.getElementById('message');
async function load() {
  const response = await fetch('/api/navigation', { credentials: 'same-origin', cache: 'no-store' });
  if (!response.ok) throw new Error('Die Zugänge konnten nicht geladen werden. Bitte melde dich erneut an.');
  const data = await response.json();
  document.getElementById('username').textContent = data.username;
  document.getElementById('title').textContent = data.title;
  document.getElementById('intro').textContent = data.intro;
  document.title = data.title + ' · Was weiß ich?!';
  for (const group of data.sections) {
    const section = document.createElement('section'); section.className = 'card';
    const heading = document.createElement('h2'); heading.textContent = group.title; section.append(heading);
    for (const item of group.links) {
      const target = new URL(item.href, location.origin);
      if (target.origin !== location.origin) continue;
      const link = document.createElement('a');link.className = 'entry';link.href = target.pathname + target.search + target.hash;link.target = '_blank';link.rel = 'noopener noreferrer';
      const label = document.createElement('strong');label.textContent = item.label;link.append(label);
      if (item.description) {const text = document.createElement('small');text.textContent = item.description;link.append(text);}
      section.append(link);
    }
    document.getElementById('sections').append(section);
  }
}
document.getElementById('logout').addEventListener('click', async () => {
  const response = await fetch('/logout', { method: 'POST', credentials: 'same-origin', headers: { 'X-VDO-Action': 'logout' } });
  if (response.ok) location.reload(); else message.textContent = 'Abmelden gerade nicht möglich.';
});
load().catch(error => { message.textContent = error.message; });
</script>
</html>
